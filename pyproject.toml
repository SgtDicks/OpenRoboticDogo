[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doggo-control"
version = "0.1.0"
description = "Fresh Raspberry Pi-first control stack for Doggo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "pyserial>=3.5,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
vision = [
  "opencv-python>=4.10,<5.0",
]

[project.scripts]
doggo = "doggo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
