robot:
  name: Doggo

servo_bus:
  enabled: true
  device: COM4
  baud_rate: 1000000
  timeout_seconds: 0.05
  scan_start_id: 1
  scan_end_id: 12

web:
  host: 0.0.0.0
  port: 8080

esp32:
  enabled: true
  listen_host: 0.0.0.0
  listen_port: 8765
  command_timeout_ms: 250

motion:
  loop_hz: 40
  default_speed: 1200
  default_acceleration: 30
  stand_speed: 700
  stand_acceleration: 10
  sit_speed: 320
  sit_acceleration: 5

walking:
  enabled: true
  gait: crawl
  command_deadzone: 0.08
  cycle_time_seconds: 3.2
  swing_ratio: 0.25
  hip_strafe_ticks: 45
  knee_stride_ticks: 90
  knee_lift_ticks: 60
  foot_lift_ticks: 140
  step_speed: 260
  step_acceleration: 4
  leg_order: [rear_left, front_right, rear_right, front_left]
  legs:
    front_left:
      forward_sign: 1
      strafe_sign: 1
      turn_sign: 1
