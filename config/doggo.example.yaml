robot:
  name: Doggo

servo_bus:
  enabled: true
  device: /dev/ttyUSB0
  baud_rate: 1000000
  timeout_seconds: 0.05
  scan_start_id: 1
  scan_end_id: 12

web:
  host: 0.0.0.0
  port: 8080

esp32:
  enabled: true
  listen_host: 0.0.0.0
  listen_port: 8765
  command_timeout_ms: 250

motion:
  loop_hz: 40
  default_speed: 1200
  default_acceleration: 30
  stand_speed: 700
  stand_acceleration: 10
  sit_speed: 500
  sit_acceleration: 8

vision:
  enabled: false
  track_target: person
  camera_indexes: [0, 1]

